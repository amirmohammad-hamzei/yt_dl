name: 🎬 YouTube Downloader Pro v7

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube Video URL'
        required: true
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'رمز فایل ZIP (اختیاری - خالی بذارید بدون رمز باشه)'
        required: false
        default: ''
      batch_id:
        description: 'شناسه یکتای batch (اختیاری - برای پنل وب)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start WARP
        run: |
          echo "Starting WARP VPN..."
          
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker.io
            sudo systemctl start docker
          fi
          
          docker rm -f warp 2>/dev/null || true
          
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "Waiting for WARP to connect..."
          sleep 10
          
          for i in $(seq 1 20); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp"; then
              echo "✅ WARP connected!"
              exit 0
            fi
            echo "  Attempt $i/20..."
            sleep 5
          done
          
          echo "⚠️ WARP might not be fully ready, continuing anyway..."

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zip unzip p7zip-full python3-pip ffmpeg
          pip3 install -q yt-dlp
          echo "✅ Tools ready!"

      - name: Download & Process YouTube Video
        env:
          YT_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
          BATCH_ID: ${{ github.event.inputs.batch_id }}
        run: |
          if [ -n "$BATCH_ID" ]; then
            BATCH_FOLDER="$BATCH_ID"
          else
            TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
            BATCH_FOLDER="yt_${TIMESTAMP}"
          fi
          
          mkdir -p downloads
          mkdir -p "downloads/${BATCH_FOLDER}"
          cd "downloads/${BATCH_FOLDER}"
          
          URL="$YT_URL"
          QUALITY="$QUALITY"
          PASSWORD="$PASSWORD"
          PROXY="socks5://127.0.0.1:1080"
          
          echo "URL: $URL"
          echo "Quality: $QUALITY"
          echo "Batch: ${BATCH_FOLDER}"
          echo ""
          
          case "$QUALITY" in
            audio) FMT="bestaudio[ext=m4a]/bestaudio/best"; IS_AUDIO=true ;;
            1080)  FMT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"; IS_AUDIO=false ;;
            720)   FMT="bestvideo[height<=720]+bestaudio/best[height<=720]"; IS_AUDIO=false ;;
            480)   FMT="bestvideo[height<=480]+bestaudio/best[height<=480]"; IS_AUDIO=false ;;
            *)     FMT="bestvideo+bestaudio/best"; IS_AUDIO=false ;;
          esac
          
          try_download() {
            local use_proxy="${1:-true}"
            local client="$2"
            
            echo "▶ Downloading (proxy:$use_proxy, client:$client)..."
            
            [ "$use_proxy" = true ] && PROXY_ARG="--proxy $PROXY" || PROXY_ARG=""
            [ "$client" != "default" ] && CLIENT_ARG="--extractor-args youtube:player_client=$client" || CLIENT_ARG=""
            
            yt-dlp $PROXY_ARG -f "$FMT" \
              $([ "$IS_AUDIO" = false ] && echo "--merge-output-format mp4") \
              -o "%(title)s.%(ext)s" \
              --no-playlist --retries 10 --fragment-retries 10 \
              --no-check-certificates \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              $CLIENT_ARG "$URL" 2>&1 | tail -5
            
            [ "$(ls -A . 2>/dev/null)" ] && return 0 || return 1
          }
          
          DOWNLOAD_SUCCESS=false
          
          for client in android ios web default; do
            [ "$DOWNLOAD_SUCCESS" = false ] && try_download true "$client" && DOWNLOAD_SUCCESS=true
          done
          
          for client in android ios web default; do
            [ "$DOWNLOAD_SUCCESS" = false ] && try_download false "$client" && DOWNLOAD_SUCCESS=true
          done
          
          [ "$DOWNLOAD_SUCCESS" = false ] && echo "❌ FAILED" && exit 1
          
          downloaded_file=$(ls -t | head -1)
          size=$(stat -c%s "$downloaded_file")
          echo "✅ Downloaded: $downloaded_file ($((size / 1024 / 1024)) MB)"
          
          # Audio conversion
          if [ "$IS_AUDIO" = true ]; then
            echo "🎵 Converting to MP3..."
            name="${downloaded_file%.*}"
            ffmpeg -i "$downloaded_file" -vn -codec:a libmp3lame -b:a 320k -ar 44100 -ac 2 "${name}.mp3" -y 2>/dev/null
            if [ -s "${name}.mp3" ]; then
              rm -f "$downloaded_file"
              downloaded_file="${name}.mp3"
              size=$(stat -c%s "$downloaded_file")
            fi
          fi
          
          # Video conversion
          if [ "$IS_AUDIO" = false ]; then
            codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$downloaded_file" 2>/dev/null || echo "unknown")
            if [ "$codec" != "h264" ] && [ "$codec" != "unknown" ]; then
              echo "🎬 Converting to H.264..."
              name="${downloaded_file%.*}"
              ffmpeg -i "$downloaded_file" -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k \
                -movflags +faststart -pix_fmt yuv420p "${name}_h264.mp4" -y 2>/dev/null
              if [ -s "${name}_h264.mp4" ]; then
                rm -f "$downloaded_file"
                mv "${name}_h264.mp4" "${name}.mp4"
                downloaded_file="${name}.mp4"
                size=$(stat -c%s "$downloaded_file")
              fi
            elif [[ "$downloaded_file" == *.mkv ]] || [[ "$downloaded_file" == *.webm ]]; then
              name="${downloaded_file%.*}"
              ffmpeg -i "$downloaded_file" -c copy "${name}.mp4" -y 2>/dev/null
              [ -s "${name}.mp4" ] && rm -f "$downloaded_file" && downloaded_file="${name}.mp4" && size=$(stat -c%s "$downloaded_file")
            fi
          fi
          
          # ZIP & Split
          base="${downloaded_file%.*}"
          
          if [ "$size" -gt 94371840 ]; then
            echo "📦 Zipping & splitting..."
            ZIP_NAME="${base}.zip"
            [ -n "$PASSWORD" ] && zip -P "$PASSWORD" "$ZIP_NAME" "$downloaded_file" 2>/dev/null || zip "$ZIP_NAME" "$downloaded_file" 2>/dev/null
            
            if [ -s "$ZIP_NAME" ]; then
              rm -f "$downloaded_file"
              PARTS_DIR="${base}_parts"
              mkdir -p "$PARTS_DIR"
              mv "$ZIP_NAME" "$PARTS_DIR/"
              cd "$PARTS_DIR"
              split -b 90M -d "$ZIP_NAME" "part_"
              rm "$ZIP_NAME"
              n=1
              for part in part_*; do
                mv "$part" "$(printf "${base}.zip.%03d" $n)"
                n=$((n + 1))
              done
              echo "#!/bin/bash" > join.sh
              echo "cat ${base}.zip.* > ../${base}.zip" >> join.sh
              chmod +x join.sh
              echo "@echo off" > join.bat
              echo "copy /b ${base}.zip.* ..\\${base}.zip" >> join.bat
              cd ..
            fi
          else
            echo "📄 File <= 90MB, keeping original"
          fi
          
          echo "✅ Done!"
          cd ../..
          
          # Save list of created files
          find "downloads/${BATCH_FOLDER}" -type f > "../created_files.txt"
          
          cd ..

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: Upload via GitHub API (No Conflicts)
        if: always()
        run: |
          echo "📤 Uploading files via API..."
          
          # Get files to upload
          if [ ! -f created_files.txt ]; then
            echo "No files to upload."
            exit 0
          fi
          
          API_URL="https://api.github.com/repos/${{ github.repository }}/contents"
          
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "README.md" ] && continue
            
            # Encode file to base64
            CONTENT=$(base64 -w0 "$file")
            
            # API path
            API_PATH=$(echo "$file" | sed 's/ /%20/g')
            
            echo "  Uploading: $file"
            
            # Upload via API
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"📥 Download [skip ci]\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"}" \
              "$API_URL/$API_PATH" > /dev/null
            
            echo "    ✅ Done!"
            
          done < created_files.txt
          
          echo ""
          echo "✅ All files uploaded!"
          echo ""
          echo "📁 Download from:"
          echo "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"

      - name: Show Results
        run: |
          echo ""
          echo "=============================="
          echo " 📥 DOWNLOAD LINK"
          echo "=============================="
          echo ""
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
