name: "01- 🎬 YouTube Downloader (Artifact Mode)"

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: "🔗 YouTube video URLs — separate with spaces"
        required: true
        type: string
      download_subtitles:
        description: "📝 Download subtitles (English & Persian)"
        required: false
        default: false
        type: boolean
      quality:
        description: "🎬 Video quality"
        required: false
        default: "best"
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: "🔒 Password for zip file (optional)"
        required: false
        default: ""
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read # دیگه نیازی به نوشتن روی مخزن نداریم (پوش نمی‌کنیم)

    steps:
      # دیگه checkout لازم نیست، چون قرار نیست چیزی پوش کنیم

      - name: "⚙️ Configure Git"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured."

      - name: "🌐 Start WARP Container (Proxy)"
        run: |
          echo "Starting Cloudflare WARP..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize..."
          sleep 15

          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              break
            else
              echo "Attempt $i/5 - waiting..."
              sleep 5
            fi
          done

      - name: "📦 Install Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip

          # Install Deno (for YouTube JS challenge solving)
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH

          pip3 install --upgrade yt-dlp

      - name: "🎯 Download, Process & Package"
        env:
          YT_URLS: ${{ github.event.inputs.youtube_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
          DOWNLOAD_SUBS: ${{ github.event.inputs.download_subtitles }}
        run: |
          # ─────────────────────────────────────────────────────────
          # AVASAM YouTube Downloader - Artifact Mode
          # https://avasam.ir
          # ─────────────────────────────────────────────────────────

          set -e # Exit on first error

          URLS_RAW="${YT_URLS}"
          read -ra URL_LIST <<< "$URLS_RAW"
          TOTAL_URLS=${#URL_LIST[@]}

          QUALITY="${YT_QUALITY}"
          ZIP_PASSWORD="${YT_PASSWORD}"
          SPLIT_MB=45  # برای قطعه‌قطعه کردن فایل‌های حجیم (فقط برای نمایش داخل زیپ) - آرتیفکت خودش سایز نامحدود داره
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))

          # دایرکتوری اصلی برای بسته‌بندی نهایی
          BASE_DIR="/home/runner/artifact_packages"
          mkdir -p "$BASE_DIR"

          echo "============================================="
          echo " AVASAM YouTube Downloader - Artifact Mode"
          echo "============================================="
          echo " URL Count: $TOTAL_URLS"
          echo " Quality: $QUALITY"
          echo " Subtitles: ${DOWNLOAD_SUBS}"
          echo " Password: ${ZIP_PASSWORD:-None}"
          echo " MANDEGARI: 1 days"
          echo "============================================="
          echo ""

          # ─────────── توابع کمکی ───────────
          sanitize_name() {
            echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-'
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # ─────────── تنظیم فرمت بر اساس کیفیت ───────────
          case "$QUALITY" in
            "audio")
              FORMAT="bestaudio/bestaudio*"
              ;;
            "best")
              FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best"
              ;;
            "2160"|"4k")
              FORMAT="bestvideo[height=2160]+bestaudio/bestvideo[height<=2160]+bestaudio/bestvideo[height=2160]*+bestaudio*/bestvideo[height<=2160]*+bestaudio*"
              ;;
            "1440"|"2k")
              FORMAT="bestvideo[height=1440]+bestaudio/bestvideo[height<=1440]+bestaudio/bestvideo[height=1440]*+bestaudio*/bestvideo[height<=1440]*+bestaudio*"
              ;;
            "1080")
              FORMAT="bestvideo[height=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/bestvideo[height=1080]*+bestaudio*/bestvideo[height<=1080]*+bestaudio*"
              ;;
            "720")
              FORMAT="bestvideo[height=720]+bestaudio/bestvideo[height<=720]+bestaudio/bestvideo[height=720]*+bestaudio*/bestvideo[height<=720]*+bestaudio*"
              ;;
            "480")
              FORMAT="bestvideo[height=480]+bestaudio/bestvideo[height<=480]+bestaudio/bestvideo[height=480]*+bestaudio*/bestvideo[height<=480]*+bestaudio*"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best"
              ;;
          esac

          # ─────────── تابع اصلی دانلود (همان ۸ متد قبلی) ───────────
          download_video() {
            local METHOD=$1
            local URL=$2
            local TMP_DIR=$3
            echo "  → Trying method $METHOD..."

            if [ "$QUALITY" = "audio" ]; then
              COMMON_FLAGS="--extract-audio --audio-format mp3 --audio-quality 0 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            elif [ "$QUALITY" = "best" ]; then
              COMMON_FLAGS="--merge-output-format mp4 --format-sort res,+codec:vp9.1,+size --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            else
              COMMON_FLAGS="--merge-output-format mp4 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            fi

            case $METHOD in
              1)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$URL" ;;
              2)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:npm --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$URL" ;;
              3)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web,mweb,android_vr" --js-runtimes deno --remote-components ejs:github "$URL" ;;
              4)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=mweb" "$URL" ;;
              5)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=android_vr" "$URL" ;;
              6)
                yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github "$URL" ;;
              7)
                yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=mweb" "$URL" ;;
              8)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=android" --user-agent "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36" "$URL" ;;
            esac
          }

          # ─────────── پردازش هر لینک ───────────
          URL_INDEX=0
          for URL in "${URL_LIST[@]}"; do
            URL_INDEX=$((URL_INDEX + 1))
            echo "============================================================"
            echo " Processing URL $URL_INDEX / $TOTAL_URLS : $URL"
            echo "============================================================"

            # تبدیل لینک‌های کوتاه
            if [[ "$URL" =~ youtu\.be/([a-zA-Z0-9_-]+) ]]; then
              VIDEO_ID="${BASH_REMATCH[1]}"
              VIDEO_ID="${VIDEO_ID%%\?*}"
              URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
              echo " Normalized URL: $URL"
            fi

            TMP_DIR="tmp_downloads_${URL_INDEX}"
            mkdir -p "$TMP_DIR"

            # دانلود با اولویت‌بندی متدها
            DOWNLOAD_SUCCESS=false
            for METHOD in 1 2 3 4 5 6 7 8; do
              if download_video $METHOD "$URL" "$TMP_DIR"; then
                echo "  ✅ Success with method $METHOD!"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "  ❌ Method $METHOD failed."
                sleep 2
              fi
            done

            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo "❌ All methods failed for URL: $URL — skipping."
              rm -rf "$TMP_DIR"
              continue
            fi

            # شناسایی فایل ویدیویی دانلود شده
            VIDEO_FILE=$(find "$TMP_DIR" -type f ! -name "*.jpg" ! -name "*.webp" | head -1)
            THUMB_FILE=$(find "$TMP_DIR" -type f -name "*.jpg" -o -name "*.webp" | head -1)

            if [ -z "$VIDEO_FILE" ]; then
              echo "⚠️ No video file found, skipping."
              rm -rf "$TMP_DIR"
              continue
            fi

            FILENAME_NO_EXT=$(basename "$VIDEO_FILE" | sed 's/\.[^.]*$//' | sanitize_name)
            EXT="${VIDEO_FILE##*.}"

            # ساخت پوشه نهایی بسته
            PACK_FOLDER="$BASE_DIR/${FILENAME_NO_EXT}"
            mkdir -p "$PACK_FOLDER"

            # کپی ویدیو به پوشه بسته
            cp "$VIDEO_FILE" "$PACK_FOLDER/${FILENAME_NO_EXT}.${EXT}"

            # کپی تصویر در صورت وجود
            if [ -n "$THUMB_FILE" ] && [ -f "$THUMB_FILE" ]; then
              cp "$THUMB_FILE" "$PACK_FOLDER/thumbnail.jpg"
            fi

            SIZE=$(stat -c%s "$VIDEO_FILE")
            SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)

            # ─── دانلود زیرنویس (اختیاری) ───
            if [ "$DOWNLOAD_SUBS" = "true" ]; then
              echo "  Fetching subtitles..."
              SUB_DIR="$PACK_FOLDER/subtitle"
              mkdir -p "$SUB_DIR"

              yt-dlp --proxy "socks5://127.0.0.1:1080" --write-sub --sub-langs fa,en --write-auto-sub --sub-format vtt/srt/best --convert-subs vtt --skip-download --no-playlist --no-check-certificates --output "${SUB_DIR}/%(title)s" --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github "$URL" 2>/dev/null || echo "  Subtitle download had issues, but continuing..."
            fi

            # ─── ساخت README (دلخواه) ───
            echo "# ${FILENAME_NO_EXT}" > "$PACK_FOLDER/README.md"
            echo "" >> "$PACK_FOLDER/README.md"
            echo "- **Size:** ${SIZE_MB} MB" >> "$PACK_FOLDER/README.md"
            echo "- **Quality:** ${QUALITY}" >> "$PACK_FOLDER/README.md"
            echo "- **Link:** $URL" >> "$PACK_FOLDER/README.md"

            echo "✅ Package ready: $PACK_FOLDER"
            rm -rf "$TMP_DIR"
          done

          echo ""
          echo "===== Packages Summary ====="
          ls -la "$BASE_DIR"

          # ذخیره مسیر BASE_DIR برای استپ بعدی
          echo "$BASE_DIR" > /tmp/artifact_dir.txt

      - name: "📤 Upload Artifacts (1-Day Expiry)"
        uses: actions/upload-artifact@v4
        with:
          name: youtube-videos-${{ github.run_id }}
          path: /home/runner/artifact_packages/*
          retention-days: 1

      - name: "🧹 Stop WARP Container"
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: "✅ Final Report"
        run: |
          echo ""
          echo "==============================================="
          echo " DOWNLOAD COMPLETED SUCCESSFULLY!"
          echo "==============================================="
          echo " 📦 Artifact Name: youtube-videos-${{ github.run_id }}"
          echo " ⏳ Expires in: 1 day"
          echo " 🔗 Download Link: Check the 'Artifacts' section on this workflow run page."
          echo ""
          echo " made in AVASAM (https://avasam.ir)"
          echo "==============================================="
