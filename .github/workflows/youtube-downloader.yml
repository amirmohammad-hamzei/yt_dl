name: 🎬 YouTube Downloader Pro

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube Video URL'
        required: true
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'Zip password (optional)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Start WARP
        run: |
          echo "Starting WARP VPN..."
          
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker.io
            sudo systemctl start docker
          fi
          
          docker rm -f warp 2>/dev/null || true
          
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "Waiting for WARP to connect..."
          sleep 15
          
          for i in $(seq 1 15); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp"; then
              echo "✅ WARP connected!"
              exit 0
            fi
            echo "  Attempt $i/15..."
            sleep 10
          done
          
          echo "⚠️ WARP may not be ready, continuing anyway..."

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg zip unzip p7zip-full curl jq bc wget
          pip3 install -q --upgrade yt-dlp

      - name: Download YouTube Video
        env:
          YT_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads
          cd downloads
          
          URL="$YT_URL"
          QUALITY="$QUALITY"
          
          echo "========================================"
          echo "  YouTube Downloader"
          echo "========================================"
          echo "URL: $URL"
          echo "Quality: $QUALITY"
          echo ""
          
          # Quality selection
          case "$QUALITY" in
            audio)
              FMT="bestaudio[ext=m4a]/bestaudio"
              IS_AUDIO=true
              ;;
            1080)
              FMT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
              IS_AUDIO=false
              ;;
            720)
              FMT="bestvideo[height<=720]+bestaudio/best[height<=720]"
              IS_AUDIO=false
              ;;
            480)
              FMT="bestvideo[height<=480]+bestaudio/best[height<=480]"
              IS_AUDIO=false
              ;;
            *)
              FMT="bestvideo+bestaudio/best"
              IS_AUDIO=false
              ;;
          esac
          
          # Download function with retry
          download_video() {
            local method="$1"
            local extra_args="$2"
            
            echo "Method $method: Trying..."
            
            if [ "$IS_AUDIO" = true ]; then
              yt-dlp \
                --proxy socks5://127.0.0.1:1080 \
                -f "$FMT" \
                -o "%(title)s.%(ext)s" \
                --no-playlist \
                --retries 5 \
                --fragment-retries 5 \
                --no-check-certificates \
                $extra_args \
                "$URL" 2>&1 | tail -5
            else
              yt-dlp \
                --proxy socks5://127.0.0.1:1080 \
                -f "$FMT" \
                --merge-output-format mp4 \
                -o "%(title)s.mp4" \
                --no-playlist \
                --retries 5 \
                --fragment-retries 5 \
                --no-check-certificates \
                $extra_args \
                "$URL" 2>&1 | tail -5
            fi
          }
          
          SUCCESS=false
          
          # Method 1: Normal with WARP
          if download_video 1 ""; then
            [ "$(ls -A . 2>/dev/null)" ] && SUCCESS=true
          fi
          
          # Method 2: Android client
          if [ "$SUCCESS" = false ]; then
            if download_video 2 "--extractor-args youtube:player_client=android"; then
              [ "$(ls -A . 2>/dev/null)" ] && SUCCESS=true
            fi
          fi
          
          # Method 3: iOS client
          if [ "$SUCCESS" = false ]; then
            if download_video 3 "--extractor-args youtube:player_client=ios"; then
              [ "$(ls -A . 2>/dev/null)" ] && SUCCESS=true
            fi
          fi
          
          # Method 4: TV embedded client
          if [ "$SUCCESS" = false ]; then
            if download_video 4 "--extractor-args youtube:player_client=tv_embedded"; then
              [ "$(ls -A . 2>/dev/null)" ] && SUCCESS=true
            fi
          fi
          
          # Method 5: Without proxy
          if [ "$SUCCESS" = false ]; then
            echo "Method 5: Direct (no proxy)..."
            if [ "$IS_AUDIO" = true ]; then
              yt-dlp -f "$FMT" -o "%(title)s.%(ext)s" --no-playlist --retries 5 "$URL" 2>&1 | tail -5
            else
              yt-dlp -f "$FMT" --merge-output-format mp4 -o "%(title)s.mp4" --no-playlist --retries 5 "$URL" 2>&1 | tail -5
            fi
            [ "$(ls -A . 2>/dev/null)" ] && SUCCESS=true
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ ALL METHODS FAILED!"
            exit 1
          fi
          
          echo ""
          echo "✅ Download successful!"
          
          # Convert audio to MP3 if needed
          if [ "$IS_AUDIO" = true ]; then
            echo ""
            echo "Converting to MP3 320kbps..."
            for f in *; do
              [ -f "$f" ] || continue
              name="${f%.*}"
              echo "  Processing: $f"
              ffmpeg -i "$f" -vn -codec:a libmp3lame -b:a 320k -ar 44100 -ac 2 "${name}.mp3" -y 2>/dev/null
              if [ -f "${name}.mp3" ]; then
                rm -f "$f"
                echo "  → ${name}.mp3"
              fi
            done
          fi
          
          # Show what we got
          echo ""
          echo "Downloaded files:"
          ls -lh

      - name: Convert to H.264
        if: success()
        run: |
          echo "========================================"
          echo "  Converting to H.264 (if needed)"
          echo "========================================"
          
          cd downloads
          
          for f in *; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            name="${f%.*}"
            
            # Check if video needs conversion
            if [ "$ext" = "mp4" ] || [ "$ext" = "mkv" ] || [ "$ext" = "webm" ]; then
              echo "Checking: $f"
              
              # Check if already H.264
              codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null)
              
              if [ "$codec" != "h264" ]; then
                echo "  Converting from $codec to H.264..."
                ffmpeg -i "$f" \
                  -c:v libx264 -preset fast -crf 23 \
                  -c:a aac -b:a 128k \
                  -movflags +faststart \
                  -pix_fmt yuv420p \
                  "${name}_h264.mp4" -y 2>/dev/null
                
                if [ -f "${name}_h264.mp4" ]; then
                  rm -f "$f"
                  mv "${name}_h264.mp4" "$f"
                  echo "  ✅ Converted to H.264"
                fi
              else
                echo "  Already H.264, skipping"
              fi
            fi
          done
          
          cd ..
          echo "Conversion complete!"

      - name: Package and Split
        if: success()
        run: |
          SPLIT_MB=90
          PASSWORD="${{ github.event.inputs.password }}"
          
          echo "========================================"
          echo "  Packaging Files"
          echo "========================================"
          
          rm -rf output
          mkdir -p output
          
          cd downloads
          
          for f in *; do
            [ -f "$f" ] || continue
            
            name="${f%.*}"
            size=$(stat -c%s "$f")
            size_mb=$((size / 1024 / 1024))
            
            echo "Processing: $f (${size_mb}MB)"
            
            out_dir="../output/${name}"
            mkdir -p "$out_dir"
            
            # Step 1: Always create ZIP first (for consistency)
            echo "  Creating ZIP..."
            zip_file="${name}.zip"
            
            if [ -n "$PASSWORD" ]; then
              zip -j -P "$PASSWORD" "../${zip_file}" "$f" 2>/dev/null
            else
              zip -j "../${zip_file}" "$f" 2>/dev/null
            fi
            
            if [ ! -f "../${zip_file}" ]; then
              echo "  ❌ ZIP failed, copying original"
              cp "$f" "$out_dir/"
              continue
            fi
            
            zip_size=$(stat -c%s "../${zip_file}")
            zip_size_mb=$((zip_size / 1024 / 1024))
            echo "  ZIP size: ${zip_size_mb}MB"
            
            # Step 2: Split if > 90MB using 7z (creates .zip.001, .zip.002, ...)
            if [ "$zip_size" -gt 94371840 ]; then
              echo "  Splitting into ${SPLIT_MB}MB parts..."
              
              mv "../${zip_file}" "$out_dir/"
              cd "$out_dir"
              
              # Use 7z to create multi-volume ZIP
              if [ -n "$PASSWORD" ]; then
                7z a -tzip -v${SPLIT_MB}m -p"$PASSWORD" -mhe=on "${name}.zip" "${zip_file}" > /dev/null 2>&1
              else
                7z a -tzip -v${SPLIT_MB}m "${name}.zip" "${zip_file}" > /dev/null 2>&1
              fi
              
              if ls "${name}.zip".* >/dev/null 2>&1; then
                rm -f "${zip_file}"
                part_count=$(ls -1 "${name}.zip".* 2>/dev/null | wc -l)
                echo "  ✅ Split into ${part_count} parts"
                
                # List parts
                ls -lh "${name}.zip".*
              else
                echo "  ⚠️ Split failed, keeping full ZIP"
                mv "${zip_file}" "../${name}.zip"
              fi
              
              cd ../../downloads
            else
              # Under 90MB, just move the ZIP
              mv "../${zip_file}" "$out_dir/"
              echo "  ✅ Single file (no split needed)"
            fi
            
            # Cleanup original
            rm -f "$f"
            echo ""
          done
          
          cd ..
          rm -rf downloads
          
          echo ""
          echo "========================================"
          echo "  Final Files"
          echo "========================================"
          find output -type f -exec ls -lh {} \;
          
          # Create README for each split
          for dir in output/*/; do
            [ -d "$dir" ] || continue
            
            if ls "$dir"/*.zip.* >/dev/null 2>&1; then
              dname=$(basename "$dir")
              
              cat > "$dir/README.md" << EOF
          # 📦 Multi-Volume ZIP Archive
          
          **File:** ${dname}.zip
          **Format:** 7z Multi-Volume ZIP
          
          ## ✨ Open directly - no joining needed!
          
          ### 📱 Android
          Open **${dname}.zip.001** with **ZArchiver**
          
          ### 📱 iOS  
          Open **${dname}.zip.001** with **iZip**
          
          ### 🖥️ Windows
          Right-click **${dname}.zip.001** → **7-Zip** → Extract
          
          ### 🖥️ macOS
          Double-click **${dname}.zip.001** (The Unarchiver)
          
          ### 🐧 Linux
          \`7z x ${dname}.zip.001\`
          
          ## ⚠️ Important
          - Download ALL parts to the **same folder**
          - Open the **FIRST part** (.zip.001)
          - The program reads all parts automatically
          EOF
              
              echo "  ✅ README created for $dname"
            fi
          done

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: Save to Repository
        if: success()
        run: |
          echo "Saving to GitHub..."
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/ 2>/dev/null || true
          
          if git diff --cached --quiet 2>/dev/null; then
            echo "No files to save!"
            exit 0
          fi
          
          git commit -m "📥 Downloaded YouTube video [skip ci]" 2>/dev/null || true
          
          echo "Pushing..."
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} 2>/dev/null && break
            echo "Retry $i..."
            sleep 5
          done
          
          echo ""
          echo "========================================"
          echo "  ✅ FILES SAVED!"
          echo "========================================"
          echo ""
          echo "Download from:"
          echo "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/output"
          echo ""
          echo "Files:"
          find output -type f -exec ls -lh {} \;

      - name: Show Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "  🎉 COMPLETE!"
          echo "=========================================="
          echo ""
          echo "📁 Your files:"
          find output -type f -name "*.zip" -o -name "*.zip.*" 2>/dev/null | while read f; do
            ls -lh "$f"
          done
          echo ""
          echo "📱 Open .zip.001 with ZArchiver or 7-Zip!"
