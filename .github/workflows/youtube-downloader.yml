name: 🎬 YouTube Downloader Pro v2

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube Video URL'
        required: true
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'رمز فایل ZIP (اختیاری - خالی بذارید بدون رمز باشه)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start WARP
        run: |
          echo "Starting WARP VPN..."
          
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker.io
            sudo systemctl start docker
          fi
          
          docker rm -f warp 2>/dev/null || true
          
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "Waiting for WARP to connect..."
          sleep 10
          
          for i in $(seq 1 20); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp"; then
              echo "✅ WARP connected!"
              exit 0
            fi
            echo "  Attempt $i/20..."
            sleep 5
          done
          
          echo "⚠️ WARP might not be fully ready, continuing anyway..."

      - name: Install Tools
        run: |
          echo "Installing ALL required tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zip unzip p7zip-full python3-pip ffmpeg
          pip3 install -q yt-dlp
          
          echo "✅ Tools ready!"
          echo "yt-dlp: $(yt-dlp --version 2>/dev/null || echo 'FAILED')"
          echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1 || echo 'FAILED')"

      - name: Download & Process YouTube Video
        env:
          YT_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          # Clean start
          rm -rf downloads
          mkdir -p downloads
          cd downloads
          
          PROCESS_LOG="../process.log"
          echo "Download started: $(date)" > "$PROCESS_LOG"
          
          URL="$YT_URL"
          QUALITY="$QUALITY"
          PASSWORD="$PASSWORD"
          
          PROXY="socks5://127.0.0.1:1080"
          
          echo "========================================" | tee -a "$PROCESS_LOG"
          echo "  YouTube Downloader (WARP)" | tee -a "$PROCESS_LOG"
          echo "========================================" | tee -a "$PROCESS_LOG"
          echo "URL: $URL" | tee -a "$PROCESS_LOG"
          echo "Quality: $QUALITY" | tee -a "$PROCESS_LOG"
          echo "" | tee -a "$PROCESS_LOG"
          
          # Quality format selection
          case "$QUALITY" in
            audio)
              FMT="bestaudio[ext=m4a]/bestaudio/best"
              IS_AUDIO=true
              ;;
            1080)
              FMT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
              IS_AUDIO=false
              ;;
            720)
              FMT="bestvideo[height<=720]+bestaudio/best[height<=720]"
              IS_AUDIO=false
              ;;
            480)
              FMT="bestvideo[height<=480]+bestaudio/best[height<=480]"
              IS_AUDIO=false
              ;;
            *)
              FMT="bestvideo+bestaudio/best"
              IS_AUDIO=false
              ;;
          esac
          
          # Download function
          try_download() {
            local method="$1"
            local client="$2"
            local use_proxy="${3:-true}"
            
            echo "▶ Method $method (client: $client, proxy: $use_proxy)..." | tee -a "$PROCESS_LOG"
            
            if [ "$use_proxy" = true ]; then
              PROXY_ARG="--proxy $PROXY"
            else
              PROXY_ARG=""
            fi
            
            if [ "$client" != "default" ]; then
              CLIENT_ARG="--extractor-args youtube:player_client=$client"
            else
              CLIENT_ARG=""
            fi
            
            if [ "$IS_AUDIO" = true ]; then
              yt-dlp $PROXY_ARG \
                -f "$FMT" \
                -o "%(title)s.%(ext)s" \
                --no-playlist \
                --retries 10 \
                --fragment-retries 10 \
                --no-check-certificates \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                $CLIENT_ARG \
                "$URL" 2>&1 | tail -3
            else
              yt-dlp $PROXY_ARG \
                -f "$FMT" \
                --merge-output-format mp4 \
                -o "%(title)s.%(ext)s" \
                --no-playlist \
                --retries 10 \
                --fragment-retries 10 \
                --no-check-certificates \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                $CLIENT_ARG \
                "$URL" 2>&1 | tail -3
            fi
            
            [ "$(ls -A . 2>/dev/null)" ] && return 0 || return 1
          }
          
          # Try all combinations
          DOWNLOAD_SUCCESS=false
          
          for client in android ios web default; do
            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              try_download "proxy-$client" "$client" true && DOWNLOAD_SUCCESS=true
            fi
          done
          
          for client in android ios web default; do
            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              try_download "direct-$client" "$client" false && DOWNLOAD_SUCCESS=true
            fi
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ] || [ ! "$(ls -A . 2>/dev/null)" ]; then
            echo "❌ FAILED: Could not download video" | tee -a "$PROCESS_LOG"
            exit 1
          fi
          
          # Get downloaded file
          downloaded_file=$(ls -t | head -1)
          size=$(stat -c%s "$downloaded_file")
          echo "✅ Downloaded: $downloaded_file ($((size / 1024 / 1024)) MB)" | tee -a "$PROCESS_LOG"
          
          # Convert audio to MP3
          if [ "$IS_AUDIO" = true ]; then
            echo "🎵 Converting to MP3 320kbps..." | tee -a "$PROCESS_LOG"
            name="${downloaded_file%.*}"
            
            ffmpeg -i "$downloaded_file" -vn -codec:a libmp3lame -b:a 320k -ar 44100 -ac 2 "${name}.mp3" -y 2>/dev/null
            
            if [ -s "${name}.mp3" ]; then
              rm -f "$downloaded_file"
              downloaded_file="${name}.mp3"
              size=$(stat -c%s "$downloaded_file")
              echo "✅ MP3 created: $((size / 1024 / 1024)) MB" | tee -a "$PROCESS_LOG"
            fi
          fi
          
          # Convert video to H.264
          if [ "$IS_AUDIO" = false ]; then
            codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$downloaded_file" 2>/dev/null || echo "unknown")
            
            if [ "$codec" != "h264" ] && [ "$codec" != "unknown" ]; then
              echo "🎬 Converting to H.264..." | tee -a "$PROCESS_LOG"
              name="${downloaded_file%.*}"
              ffmpeg -i "$downloaded_file" \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a aac -b:a 128k \
                -movflags +faststart \
                -pix_fmt yuv420p \
                "${name}_h264.mp4" -y 2>/dev/null
              
              if [ -s "${name}_h264.mp4" ]; then
                rm -f "$downloaded_file"
                mv "${name}_h264.mp4" "${name}.mp4"
                downloaded_file="${name}.mp4"
                size=$(stat -c%s "$downloaded_file")
                echo "✅ Converted: $((size / 1024 / 1024)) MB" | tee -a "$PROCESS_LOG"
              fi
            else
              if [[ "$downloaded_file" == *.mkv ]] || [[ "$downloaded_file" == *.webm ]]; then
                name="${downloaded_file%.*}"
                ffmpeg -i "$downloaded_file" -c copy "${name}.mp4" -y 2>/dev/null
                if [ -s "${name}.mp4" ]; then
                  rm -f "$downloaded_file"
                  downloaded_file="${name}.mp4"
                fi
              fi
            fi
          fi
          
          # Smart ZIP logic
          echo "📦 Processing file..." | tee -a "$PROCESS_LOG"
          base="${downloaded_file%.*}"
          
          if [ "$size" -gt 94371840 ]; then
            # ZIP and split
            echo "   File > 90MB, creating ZIP..." | tee -a "$PROCESS_LOG"
            ZIP_NAME="${base}.zip"
            
            if [ -n "$PASSWORD" ]; then
              zip -P "$PASSWORD" "$ZIP_NAME" "$downloaded_file" 2>/dev/null
            else
              zip "$ZIP_NAME" "$downloaded_file" 2>/dev/null
            fi
            
            if [ -s "$ZIP_NAME" ]; then
              rm -f "$downloaded_file"
              size=$(stat -c%s "$ZIP_NAME")
              echo "   ZIP: $((size / 1024 / 1024)) MB" | tee -a "$PROCESS_LOG"
              
              echo "✂️  Splitting (90MB parts)..." | tee -a "$PROCESS_LOG"
              PARTS_DIR="${base}_parts"
              mkdir -p "$PARTS_DIR"
              mv "$ZIP_NAME" "$PARTS_DIR/"
              cd "$PARTS_DIR"
              
              split -b 90M -d "$ZIP_NAME" "part_"
              
              if [ $? -eq 0 ]; then
                rm "$ZIP_NAME"
                n=1
                for part in part_*; do
                  new_name=$(printf "${base}.zip.%03d" $n)
                  mv "$part" "$new_name"
                  n=$((n + 1))
                done
                total=$((n - 1))
                echo "   Split into ${total} parts" | tee -a "$PROCESS_LOG"
                
                echo "#!/bin/bash" > join.sh
                echo "cat ${base}.zip.* > ../${base}.zip" >> join.sh
                chmod +x join.sh
                
                echo "@echo off" > join.bat
                echo "copy /b ${base}.zip.* ..\\${base}.zip" >> join.bat
              fi
              cd ..
            fi
          else
            echo "   File <= 90MB, keeping original" | tee -a "$PROCESS_LOG"
          fi
          
          echo "✅ Completed!" | tee -a "$PROCESS_LOG"
          cd ..
          
          # Create README with ALL files listed
          echo "# 📥 Downloaded Files" > downloads/README.md
          echo "" >> downloads/README.md
          echo "**Date:** $(date)" >> downloads/README.md
          echo "" >> downloads/README.md
          echo "## 📁 All Files" >> downloads/README.md
          echo "" >> downloads/README.md
          echo '```' >> downloads/README.md
          find downloads -type f -not -name "README.md" | sort >> downloads/README.md
          echo '```' >> downloads/README.md
          echo "" >> downloads/README.md
          echo "## 📏 Sizes" >> downloads/README.md
          echo "" >> downloads/README.md
          echo '```' >> downloads/README.md
          find downloads -type f -not -name "README.md" -exec ls -lh {} \; | awk '{print $5, $9}' >> downloads/README.md
          echo '```' >> downloads/README.md

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: Finalize & Push
        if: always()
        run: |
          echo "📤 Saving to GitHub..."
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Show what we're about to push
          echo ""
          echo "Files to push:"
          find downloads -type f -exec ls -lh {} \;
          
          git add downloads/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "📥 YouTube Download [skip ci]"
          
          echo "🚀 Pushing..."
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git push origin HEAD:${{ github.ref_name }}
          
          echo ""
          echo "=============================="
          echo " ✅ UPLOAD COMPLETE!"
          echo "=============================="
          echo ""
          echo "📁 Download your files from:"
          echo "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          echo ""

      - name: Show Results
        run: |
          echo ""
          echo "=============================="
          echo " 📥 YOUR DOWNLOAD LINK"
          echo "=============================="
          echo ""
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          echo ""
          echo "=============================="
          echo " 📁 FILES"
          echo "=============================="
          find downloads -type f -not -name "README.md" -exec ls -lh {} \; 2>/dev/null
          echo ""
          echo "📋 Copy the link above and open in browser to download!"
