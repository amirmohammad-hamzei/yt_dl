name: 🎬 YouTube Downloader Pro

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube Video URL'
        required: true
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'Zip password (optional)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Start WARP
        run: |
          echo "Starting WARP VPN..."
          
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker.io
            sudo systemctl start docker
          fi
          
          docker rm -f warp 2>/dev/null || true
          
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "Waiting for WARP to connect..."
          sleep 15
          
          for i in $(seq 1 15); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp"; then
              echo "✅ WARP connected!"
              exit 0
            fi
            echo "  Attempt $i/15..."
            sleep 10
          done
          
          echo "⚠️ WARP may not be ready, continuing anyway..."

      - name: Install Tools (Fast)
        run: |
          echo "Installing tools..."
          
          # These are already on Ubuntu runner, just need yt-dlp and 7z
          # ffmpeg, zip, unzip, curl, wget, jq, bc - all pre-installed!
          
          # Install only what's missing
          sudo apt-get install -y -qq p7zip-full python3-pip 2>/dev/null &
          wait
          
          # Install yt-dlp
          pip3 install -q --no-cache-dir yt-dlp 2>/dev/null &
          wait
          
          echo "✅ Tools ready!"
          
          # Verify
          echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1 || echo 'missing')"
          echo "yt-dlp: $(yt-dlp --version 2>/dev/null || echo 'missing')"
          echo "7z: $(7z --help 2>/dev/null | head -1 || echo 'missing')"

      - name: Download YouTube Video
        env:
          YT_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads
          cd downloads
          
          URL="$YT_URL"
          QUALITY="$QUALITY"
          
          echo "========================================"
          echo "  YouTube Downloader"
          echo "========================================"
          echo "URL: $URL"
          echo "Quality: $QUALITY"
          echo ""
          
          # Quality selection
          case "$QUALITY" in
            audio)
              FMT="bestaudio[ext=m4a]/bestaudio"
              IS_AUDIO=true
              ;;
            1080)
              FMT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
              IS_AUDIO=false
              ;;
            720)
              FMT="bestvideo[height<=720]+bestaudio/best[height<=720]"
              IS_AUDIO=false
              ;;
            480)
              FMT="bestvideo[height<=480]+bestaudio/best[height<=480]"
              IS_AUDIO=false
              ;;
            *)
              FMT="bestvideo+bestaudio/best"
              IS_AUDIO=false
              ;;
          esac
          
          # Download function
          try_download() {
            local method="$1"
            local extra_args="$2"
            local use_proxy="${3:-true}"
            
            echo "▶ Method $method..."
            
            if [ "$use_proxy" = true ]; then
              PROXY="--proxy socks5://127.0.0.1:1080"
            else
              PROXY=""
            fi
            
            if [ "$IS_AUDIO" = true ]; then
              yt-dlp $PROXY \
                -f "$FMT" \
                -o "%(title)s.%(ext)s" \
                --no-playlist \
                --retries 3 \
                --fragment-retries 3 \
                --no-check-certificates \
                --user-agent "Mozilla/5.0" \
                $extra_args \
                "$URL" 2>&1 | grep -E "(Downloading|Merging|has already been)" || true
            else
              yt-dlp $PROXY \
                -f "$FMT" \
                --merge-output-format mp4 \
                -o "%(title)s.mp4" \
                --no-playlist \
                --retries 3 \
                --fragment-retries 3 \
                --no-check-certificates \
                --user-agent "Mozilla/5.0" \
                $extra_args \
                "$URL" 2>&1 | grep -E "(Downloading|Merging|has already been)" || true
            fi
            
            if [ "$(ls -A . 2>/dev/null)" ]; then
              return 0
            else
              return 1
            fi
          }
          
          # Try all methods
          try_download 1 "" true || \
          try_download 2 "--extractor-args youtube:player_client=android" true || \
          try_download 3 "--extractor-args youtube:player_client=ios" true || \
          try_download 4 "--extractor-args youtube:player_client=web" true || \
          try_download 5 "" false || {
            echo "❌ ALL METHODS FAILED!"
            exit 1
          }
          
          echo ""
          echo "✅ Downloaded:"
          ls -lh
          
          # Convert audio to MP3
          if [ "$IS_AUDIO" = true ]; then
            echo ""
            echo "Converting to MP3 320kbps..."
            for f in *; do
              [ -f "$f" ] || continue
              name="${f%.*}"
              ffmpeg -i "$f" -vn -codec:a libmp3lame -b:a 320k -ar 44100 -ac 2 "${name}.mp3" -y 2>/dev/null &
            done
            wait
            rm -f *.m4a *.webm *.opus 2>/dev/null
            echo "✅ Converted:"
            ls -lh
          fi

      - name: Convert to H.264 (Fast)
        if: success()
        run: |
          echo "Converting to H.264..."
          
          cd downloads
          
          for f in *; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            name="${f%.*}"
            
            if [ "$ext" = "mp4" ] || [ "$ext" = "mkv" ] || [ "$ext" = "webm" ]; then
              # Quick check using ffprobe
              codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || echo "unknown")
              
              if [ "$codec" != "h264" ]; then
                echo "Converting $f ($codec → h264)..."
                ffmpeg -i "$f" \
                  -c:v libx264 -preset ultrafast -crf 23 \
                  -c:a aac -b:a 128k \
                  -movflags +faststart \
                  -pix_fmt yuv420p \
                  "${name}_h264.mp4" -y 2>/dev/null
                
                if [ -f "${name}_h264.mp4" ]; then
                  rm -f "$f"
                  mv "${name}_h264.mp4" "$f"
                  echo "  ✅ Done"
                fi
              else
                echo "  $f: Already H.264, skip"
              fi
            fi
          done
          
          cd ..
          echo "✅ Conversion complete!"

      - name: Package and Split
        if: success()
        run: |
          SPLIT_MB=90
          PASSWORD="${{ github.event.inputs.password }}"
          
          echo "Packaging files..."
          
          rm -rf output
          mkdir -p output
          
          cd downloads
          
          for f in *; do
            [ -f "$f" ] || continue
            
            name="${f%.*}"
            size=$(stat -c%s "$f")
            size_mb=$((size / 1024 / 1024))
            
            echo "→ $f (${size_mb}MB)"
            
            out_dir="../output/${name}"
            mkdir -p "$out_dir"
            
            # Create ZIP
            zip_file="${name}.zip"
            
            if [ -n "$PASSWORD" ]; then
              zip -j -P "$PASSWORD" "../${zip_file}" "$f" 2>/dev/null
            else
              zip -j "../${zip_file}" "$f" 2>/dev/null
            fi
            
            if [ ! -f "../${zip_file}" ]; then
              echo "  ⚠️ ZIP failed, copying original"
              cp "$f" "$out_dir/"
              continue
            fi
            
            zip_size=$(stat -c%s "../${zip_file}")
            zip_size_mb=$((zip_size / 1024 / 1024))
            
            # Split if > 90MB
            if [ "$zip_size" -gt 94371840 ]; then
              echo "  Splitting ${zip_size_mb}MB → ${SPLIT_MB}MB parts..."
              
              mv "../${zip_file}" "$out_dir/"
              cd "$out_dir"
              
              # 7z multi-volume ZIP
              if [ -n "$PASSWORD" ]; then
                7z a -tzip -v${SPLIT_MB}m -p"$PASSWORD" -mhe=on "${name}.zip" "${zip_file}" > /dev/null 2>&1
              else
                7z a -tzip -v${SPLIT_MB}m "${name}.zip" "${zip_file}" > /dev/null 2>&1
              fi
              
              if ls "${name}.zip".* >/dev/null 2>&1; then
                rm -f "${zip_file}"
                parts=$(ls -1 "${name}.zip".* | wc -l)
                echo "  ✅ ${parts} parts created"
              else
                echo "  ⚠️ Split failed, keeping original"
                mv "${zip_file}" "../${name}.zip"
              fi
              
              cd ../../downloads
            else
              mv "../${zip_file}" "$out_dir/"
              echo "  ✅ No split needed"
            fi
            
            rm -f "$f"
          done
          
          cd ..
          rm -rf downloads
          
          echo ""
          echo "✅ Files ready:"
          find output -type f -exec ls -lh {} \;
          
          # Create README for split files
          for dir in output/*/; do
            [ -d "$dir" ] || continue
            if ls "$dir"/*.zip.* >/dev/null 2>&1; then
              dname=$(basename "$dir")
              echo "## 📦 ${dname}" > "$dir/README.md"
              echo "" >> "$dir/README.md"
              echo "**Open \`.zip.001\` with:**" >> "$dir/README.md"
              echo "- 📱 Android: **ZArchiver**" >> "$dir/README.md"
              echo "- 📱 iOS: **iZip**" >> "$dir/README.md"
              echo "- 🖥️ Windows: **7-Zip**" >> "$dir/README.md"
              echo "- 🍎 Mac: **The Unarchiver**" >> "$dir/README.md"
              echo "" >> "$dir/README.md"
              echo "Download ALL parts to same folder first!" >> "$dir/README.md"
            fi
          done

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: Save to Repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/ 2>/dev/null || true
          
          if git diff --cached --quiet 2>/dev/null; then
            echo "No files to save"
            exit 0
          fi
          
          git commit -m "📥 Download [skip ci]" 2>/dev/null || true
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git push origin HEAD:${{ github.ref_name }} 2>/dev/null && echo "✅ Saved!" || echo "Push failed"

      - name: Show Result
        run: |
          echo ""
          echo "=========================================="
          echo "  ✅ COMPLETE"
          echo "=========================================="
          echo ""
          echo "📁 Download from:"
          echo "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/output"
          echo ""
          find output -type f -name "*.zip" -o -name "*.zip.*" | while read f; do
            ls -lh "$f"
          done
          echo ""
          echo "📱 Open .zip.001 with ZArchiver/7-Zip!"
