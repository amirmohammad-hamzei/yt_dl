name: "YouTube Downloader"

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: "YouTube video URLs - separate with spaces"
        required: true
        type: string
      download_subtitles:
        description: "Download subtitles (English & Persian)"
        required: false
        default: false
        type: boolean
      quality:
        description: "Video quality"
        required: false
        default: "best"
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: "Password for zip file (optional)"
        required: false
        default: ""
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: "Configure Environment"
        run: |
          echo "============================================"
          echo " YouTube Downloader - Starting"
          echo " Quality: ${{ github.event.inputs.quality }}"
          echo " Subtitles: ${{ github.event.inputs.download_subtitles }}"
          echo "============================================"

      - name: "Start WARP Proxy"
        run: |
          echo "Starting Cloudflare WARP..."
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP (15s)..."
          sleep 15

          for i in 1 2 3 4 5; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP connected OK"
              break
            else
              echo "WARP check $i/5 - waiting..."
              sleep 5
            fi
          done

      - name: "Install Dependencies"
        run: |
          echo "Installing packages..."
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH

          pip3 install --upgrade yt-dlp
          echo "Dependencies ready"

      - name: "Download and Package"
        env:
          YT_URLS: ${{ github.event.inputs.youtube_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
          DOWNLOAD_SUBS: ${{ github.event.inputs.download_subtitles }}
        run: |
          set -euo pipefail

          read -ra URL_LIST <<< "$YT_URLS"
          TOTAL_URLS=${#URL_LIST[@]}
          QUALITY="$YT_QUALITY"
          ZIP_PASSWORD="$YT_PASSWORD"

          BASE_DIR="/home/runner/output"
          mkdir -p "$BASE_DIR"

          echo ""
          echo "============================================"
          echo " DOWNLOAD STARTING"
          echo " URLs: $TOTAL_URLS"
          echo " Quality: $QUALITY"
          echo " Subtitles: ${DOWNLOAD_SUBS}"
          echo "============================================"

          # --- helper ---
          sanitize_name() {
            echo "$1" | sed 's/[^a-zA-Z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//'
          }

          # --- format ---
          case "$QUALITY" in
            audio)
              FORMAT="bestaudio/best"
              POST_FLAGS="--extract-audio --audio-format mp3 --audio-quality 0"
              ;;
            best)
              FORMAT="bestvideo+bestaudio/best"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            2160)
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            1440)
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            1080)
              FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            720)
              FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            480)
              FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]"
              POST_FLAGS="--merge-output-format mp4"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              POST_FLAGS="--merge-output-format mp4"
              ;;
          esac

          echo "Format: $FORMAT"
          echo ""

          # --- download function ---
          dl() {
            local M=$1
            local U=$2
            local O=$3
            local C="--format $FORMAT $POST_FLAGS --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${O}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"

            case $M in
              1) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "$U" ;;
              2) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:npm --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$U" ;;
              3) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=web,mweb,android_vr" --js-runtimes deno --remote-components ejs:github "$U" ;;
              4) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=mweb" "$U" ;;
              5) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=android_vr" "$U" ;;
              6) yt-dlp $C --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github "$U" ;;
              7) yt-dlp $C --extractor-args "youtube:player_client=mweb" "$U" ;;
              8) yt-dlp --proxy socks5://127.0.0.1:1080 $C --extractor-args "youtube:player_client=android" --user-agent "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36" "$U" ;;
            esac
          }

          # --- subtitle function ---
          sub_dl() {
            local U=$1
            local O=$2
            mkdir -p "$O"
            yt-dlp --proxy socks5://127.0.0.1:1080 --write-sub --sub-langs "fa,en" --write-auto-sub --sub-format "vtt/srt/best" --convert-subs vtt --skip-download --no-playlist --no-check-certificates --output "${O}/%(title)s" --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github "$U" 2>/dev/null || {
              yt-dlp --write-sub --sub-langs "fa,en" --write-auto-sub --sub-format "vtt/srt/best" --convert-subs vtt --skip-download --no-playlist --no-check-certificates --output "${O}/%(title)s" --extractor-args "youtube:player_client=mweb" "$U" 2>/dev/null || echo "Subtitle download failed"
            }
          }

          # --- process each URL ---
          IDX=0
          for URL in "${URL_LIST[@]}"; do
            IDX=$((IDX + 1))
            echo ""
            echo "--- [$IDX/$TOTAL_URLS] $URL ---"

            # Normalize short URLs
            if [[ "$URL" =~ youtu\.be/([a-zA-Z0-9_-]+) ]]; then
              VID="${BASH_REMATCH[1]}"
              VID="${VID%%\?*}"
              URL="https://www.youtube.com/watch?v=${VID}"
              echo "Normalized: $URL"
            fi

            TMP="/tmp/dl_${IDX}"
            mkdir -p "$TMP"

            OK=false
            for M in 1 2 3 4 5 6 7 8; do
              echo "Method $M..."
              if dl $M "$URL" "$TMP"; then
                echo "Method $M SUCCESS"
                OK=true
                break
              else
                echo "Method $M FAILED"
                sleep 2
              fi
            done

            if [ "$OK" = false ]; then
              echo "ALL METHODS FAILED for: $URL"
              rm -rf "$TMP"
              continue
            fi

            echo "Files in temp:"
            ls -lah "$TMP/" 2>/dev/null || echo "(empty)"

            # --- find media file ---
            MEDIA=$(find "$TMP" -type f \( -name "*.mp4" -o -name "*.webm" -o -name "*.mkv" -o -name "*.mp3" -o -name "*.m4a" -o -name "*.opus" -o -name "*.ogg" -o -name "*.aac" -o -name "*.flac" \) ! -name "*.part" ! -name "*.ytdl" 2>/dev/null | head -1)
            THUMB=$(find "$TMP" -type f \( -name "*.jpg" -o -name "*.webp" -o -name "*.png" \) 2>/dev/null | head -1)

            if [ -z "$MEDIA" ]; then
              echo "ERROR: No media file found! Check list above."
              echo "Possible reasons: geo-block, age gate, private video, format not available"
              rm -rf "$TMP"
              continue
            fi

            MSIZE=$(stat -c%s "$MEDIA" 2>/dev/null || echo 0)
            MSIZE_MB=$(echo "scale=1; $MSIZE / 1048576" | bc 2>/dev/null || echo "0")

            echo "Media: $(basename "$MEDIA") (${MSIZE_MB} MB)"
            [ -n "$THUMB" ] && echo "Thumbnail: $(basename "$THUMB")"

            RAW=$(basename "$MEDIA" | sed 's/\.[^.]*$//')
            SAFE=$(sanitize_name "$RAW")
            EXT="${MEDIA##*.}"

            PKG="$BASE_DIR/$SAFE"
            mkdir -p "$PKG"

            cp "$MEDIA" "$PKG/${SAFE}.${EXT}"
            [ -n "$THUMB" ] && [ -f "$THUMB" ] && cp "$THUMB" "$PKG/thumbnail.jpg"

            echo "Copied to: $PKG/${SAFE}.${EXT}"

            # --- subtitles ---
            if [ "$DOWNLOAD_SUBS" = "true" ]; then
              echo "Downloading subtitles..."
              SUBD="$PKG/subtitles"
              sub_dl "$URL" "$SUBD"
              SC=$(find "$SUBD" -type f 2>/dev/null | wc -l)
              if [ "$SC" -gt 0 ]; then
                echo "Subtitles: $SC file(s)"
              else
                echo "No subtitles available"
                rmdir "$SUBD" 2>/dev/null || true
              fi
            fi

            # --- info file (using echo instead of heredoc) ---
            echo "Name: $SAFE" > "$PKG/info.txt"
            echo "URL: $URL" >> "$PKG/info.txt"
            echo "Size: ${MSIZE_MB} MB" >> "$PKG/info.txt"
            echo "Quality: $QUALITY" >> "$PKG/info.txt"
            echo "Format: $EXT" >> "$PKG/info.txt"
            echo "Date: $(date -u +"%Y-%m-%d %H:%M UTC")" >> "$PKG/info.txt"
            echo "Subtitles: $DOWNLOAD_SUBS" >> "$PKG/info.txt"
            if [ -n "$ZIP_PASSWORD" ]; then
              echo "Password: YES" >> "$PKG/info.txt"
            else
              echo "Password: NO" >> "$PKG/info.txt"
            fi

            # --- password zip ---
            if [ -n "$ZIP_PASSWORD" ]; then
              echo "Creating password zip..."
              cd "$PKG"
              zip -r -P "$ZIP_PASSWORD" "../${SAFE}.zip" ./* > /dev/null 2>&1
              cd - > /dev/null
              rm -rf "$PKG"
              mkdir -p "$PKG"
              mv "$BASE_DIR/${SAFE}.zip" "$PKG/"
            fi

            rm -rf "$TMP"
            echo "Done: $SAFE"
          done

          # --- final check ---
          echo ""
          echo "============================================"
          echo " SUMMARY"
          echo "============================================"

          FC=$(find "$BASE_DIR" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          if [ "$FC" -eq 0 ]; then
            echo "NO VIDEOS DOWNLOADED"
            echo "Check error messages above"
            exit 1
          fi

          echo "Downloaded $FC video(s):"
          for d in "$BASE_DIR"/*/; do
            [ -d "$d" ] || continue
            DN=$(basename "$d")
            DS=$(du -sh "$d" 2>/dev/null | cut -f1)
            echo "  $DN ($DS)"
          done

          echo "$BASE_DIR" > /tmp/output_dir.txt

      - name: "Upload Artifacts (1 Day Expiry)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-videos
          path: /home/runner/output/*
          retention-days: 1

      - name: "Stop WARP"
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: "Complete"
        if: success()
        run: |
          echo ""
          echo "============================================"
          echo " DOWNLOAD COMPLETED"
          echo " Artifact: downloaded-videos"
          echo " Expires in: 1 day"
          echo " Check Artifacts section to download"
          echo "============================================"
